[project]
name = "sick"
version = "0.1.0"
description = "Self-improving coding agent built on the NOOA framework"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "Sick contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "nooa",
    "python-dotenv",
    "textual>=8.2.8",
]

[project.optional-dependencies]
pdf = ["docling>=1.0"]

[project.scripts]
sick = "sick.cli:main"

[tool.uv.sources]
nooa = { git = "https://github.com/NVIDIA-NeMo/labs-OO-Agents.git", rev = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
